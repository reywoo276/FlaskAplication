<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Бібліотека{% endblock %} — LibraryDB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="{{ url_for('index') }}">
    <span class="brand-icon">📚</span>
    <span>LibraryDB</span>
  </a>
  <div class="nav-links">
    <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Автори</a>
    <a href="{{ url_for('books_list') }}" class="nav-link {% if request.endpoint in ['books_list','book_detail','book_new','book_edit'] %}active{% endif %}">Книги</a>
    <a href="{{ url_for('audit_log') }}" class="nav-link {% if request.endpoint == 'audit_log' %}active{% endif %}">Журнал</a>
    <a href="{{ url_for('author_new') }}" class="btn-nav">+ Автор</a>
    <a href="{{ url_for('book_new') }}"   class="btn-nav">+ Книга</a>
  </div>
</nav>

<main class="main-content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>LibraryDB — Flask + PostgreSQL</span>
  <span class="footer-mono">trigger · stored procedure · transaction</span>
</footer>

</body>
</html>
